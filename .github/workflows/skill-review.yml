name: Skill Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.claude/skills/**'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          claude_args: |
            --model claude-haiku-4-5-20251001
            --allowedTools "Read,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review ONLY the skill files changed in this PR.

            STEP 1: Run `gh pr diff ${{ github.event.pull_request.number }}` to see exactly what changed.
            STEP 2: Validate ONLY the changed files against these criteria:

            ## Structure
            - SKILL.md has frontmatter with `name` and `description`
            - Follows folder convention: `.claude/skills/<skill-name>/`

            ## No Overlap
            - Does not significantly overlap with existing skills in `.claude/skills/`
            - Existing skills: api-contract-review, architecture-review, changelog-generator,
              clean-code, concurrency-review, design-patterns, git-commit, issue-triage,
              java-code-review, java-migration, jpa-patterns, logging-patterns,
              gradle-dependency-audit, performance-smell-detection, security-audit,
              solid-principles, spring-boot-patterns, test-quality,
              spring-modulith-patterns, gobd-audit, e-rechnung-patterns, archunit-volantic

            ## Quality
            - Not anemic — has substantive, actionable content
            - Specific to Volantic ERP / Spring Modulith / Java 25 / DACH compliance context
            - Checklists are concrete, not vague advice
            - Checklist has <15 items per section

            ## Output
            Post a concise PR comment using `gh pr comment` with this format:

            ```
            **Verdict**: APPROVE | REQUEST_CHANGES | NEEDS_DISCUSSION

            **Files reviewed**: [list changed files]

            **Findings**:
            - Structure: [pass/fail with brief note]
            - Overlap: [pass/fail — mention related skills if relevant]
            - Quality: [pass/fail with brief note]

            **Action required**: [if any, otherwise "None - ready to merge"]
            ```

            Keep it brief. No emojis. Actionable feedback only.
            DO NOT review files that were not changed in this PR.
