spring:
  application:
    name: volantic-erp

  # Single-tenant: one PostgreSQL database per customer (see docs/02-Datenbank-Architektur.md).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/volantic_erp}
    username: ${DB_USER:volantic}
    password: ${DB_PASSWORD:changeme}

  # Redis: cache for master data / authorization snapshots (NFR sub-500 ms). Shipped in the
  # per-installation bundle (ADR-0005). Lettuce connects lazily, so the app boots even if Redis
  # is briefly unavailable; cache errors degrade to the database (see CacheConfig).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false           # deliberately off: no lazy loads in the view layer
    hibernate:
      ddl-auto: validate          # the schema belongs to Flyway, never Hibernate auto-DDL
    properties:
      hibernate.format_sql: true
      # Safety net against accidental N+1 on associations not covered by an explicit @EntityGraph:
      # Hibernate batches lazy loads instead of issuing one query per parent.
      hibernate.default_batch_fetch_size: 100

  # Flyway per module: each business module ships its own migrations (db/migration/<module>).
  flyway:
    enabled: true
    default-schema: core
    locations:
      - classpath:db/migration/core
      - classpath:db/migration/security
      - classpath:db/migration/crm
      - classpath:db/migration/audit

  # RFC 7807 problem+json for errors (incl. bean-validation failures), consistent across modules.
  mvc:
    problemdetails:
      enabled: true

  # Authentik as the OIDC provider — the ERP is a pure resource server (validates JWTs).
  # Self-hosted model: every customer installation ships its OWN Authentik (ADR-0005); the defaults
  # below are only our dev/demo issuer and are overridden per installation via env
  # (OIDC_ISSUER_URI / OIDC_JWK_SET_URI) to point at the customer's bundled Authentik.
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri alone would load the OIDC discovery synchronously from Authentik at startup —
          # if Authentik is then unreachable, the ERP does not boot. With jwk-set-uri also set, Spring
          # builds a lazy decoder (JWKS fetched on the first request) while still validating the
          # issuer. This lets the app boot even when the IdP is briefly unreachable.
          issuer-uri: ${OIDC_ISSUER_URI:https://auth.volantic.de/application/o/volantic-erp/}
          jwk-set-uri: ${OIDC_JWK_SET_URI:https://auth.volantic.de/application/o/volantic-erp/jwks/}

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith
  endpoint:
    health:
      probes:
        enabled: true
